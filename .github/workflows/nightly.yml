name: Nightly

# The nightly correctness run (SKILLS.md, "The nightly sweep and fuzz"): every arm of exp, log
# and log1p, unmasked and masked, at every width the drawn runner has, compared with StrictMath
# by raw bits.
#
# - sweep: every one of the 2^32 high words with three low words each (Sweep.java), split into
#   `shards` stripes per function run as parallel jobs, and rotated over `nights` nights: night n
#   (days since 1970 modulo `nights`) checks stripes n*shards to n*shards+shards-1 of
#   nights*shards. With the defaults, 1 night and 4 shards, all of it every night.
# - fuzz: a fixed time per species from a fresh seed (Fuzz.java), at the runner's own flags and
#   compiled as an AVX2 host, as ci.yml's rows are.
# - arm: on an Arm runner (128 bits), a rotating sweep stripe, 1/64 of the high words a night,
#   and the fuzz.
# - proofs: every SMT proof under both solvers (proofs/README.md).
# - alert: when any of them fails, opens a GitHub issue labelled nightly-failure, or comments on
#   the open one, with the run's link and the mismatches. It is the only job that may write.
#
# The seed is fresh each night and printed by the plan job; a dispatch with that seed (and the
# night, for the sweep) replays the run. Every mismatch file is uploaded as an artifact, its
# inputs one per line as hard-cases/<function>.txt takes them.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed, 0x and up to 16 hex digits; blank for a fresh one'
        required: false
        default: ''
      nights:
        description: 'Sweep: nights to cover every high word in, a power of two'
        required: false
        default: '1'
      shards:
        description: 'Sweep: parallel jobs per function and night, a power of two'
        required: false
        default: '4'
      night:
        description: 'Sweep: which night of the rotation, 0 to nights-1; blank for today'
        required: false
        default: ''
      fuzz-seconds:
        description: 'Fuzz: seconds per function and species'
        required: false
        default: '240'

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  ARM_NIGHTS: 64

jobs:
  plan:
    # Scheduled runs only in the main repository; a fork may still dispatch it.
    if: github.event_name != 'schedule' || github.repository == 'vecbricks/vfdlibm'
    runs-on: ubuntu-latest
    outputs:
      seed: ${{ steps.plan.outputs.seed }}
      sweep: ${{ steps.plan.outputs.sweep }}
      arm-stripe: ${{ steps.plan.outputs.arm-stripe }}
      fuzz-seconds: ${{ steps.plan.outputs.fuzz-seconds }}
    steps:
      - name: Plan the night
        id: plan
        env:
          SEED: ${{ inputs.seed }}
          NIGHTS: ${{ inputs.nights || '1' }}
          SHARDS: ${{ inputs.shards || '4' }}
          NIGHT: ${{ inputs.night }}
          FUZZ_SECONDS: ${{ inputs.fuzz-seconds || '240' }}
        run: |
          pow2() { [[ $1 =~ ^[0-9]+$ ]] && [ "$1" -ge 1 ] && [ $(($1 & ($1 - 1))) -eq 0 ]; }
          if [ -z "$SEED" ]; then
            SEED="0x$(od -An -N8 -tx8 /dev/urandom | tr -d ' \n')"
          elif ! [[ $SEED =~ ^0x[0-9a-fA-F]{1,16}$ ]]; then
            echo "::error::seed takes 0x and up to 16 hex digits, not '$SEED'"; exit 1
          fi
          if ! pow2 "$NIGHTS" || ! pow2 "$SHARDS" || [ $((NIGHTS * SHARDS)) -gt 4096 ]; then
            echo "::error::nights and shards take powers of two, their product at most 4096"
            exit 1
          fi
          days=$(( $(date -u +%s) / 86400 ))
          if [ -z "$NIGHT" ]; then NIGHT=$((days % NIGHTS)); fi
          if ! [[ $NIGHT =~ ^[0-9]+$ ]] || [ "$NIGHT" -ge "$NIGHTS" ]; then
            echo "::error::night takes 0 to $((NIGHTS - 1)), not '$NIGHT'"; exit 1
          fi
          if ! [[ $FUZZ_SECONDS =~ ^[0-9]+$ ]] || [ "$FUZZ_SECONDS" -lt 1 ]; then
            echo "::error::fuzz-seconds takes a positive number, not '$FUZZ_SECONDS'"; exit 1
          fi
          total=$((NIGHTS * SHARDS))
          sweep='{"include":['
          sep=''
          for f in exp log log1p; do
            for ((j = 0; j < SHARDS; j++)); do
              stripe="$((NIGHT * SHARDS + j))/$total"
              sweep="$sweep$sep{\"function\":\"$f\",\"stripe\":\"$stripe\"}"
              sep=','
            done
          done
          sweep="$sweep]}"
          arm_stripe="$((days % ARM_NIGHTS))/$ARM_NIGHTS"
          echo "seed: $SEED"
          echo "sweep: night $NIGHT of $NIGHTS, stripes $((NIGHT * SHARDS)) to" \
            "$((NIGHT * SHARDS + SHARDS - 1)) of $total per function"
          echo "arm sweep: stripe $arm_stripe"
          echo "fuzz: $FUZZ_SECONDS s per function and species"
          {
            echo "seed=$SEED"
            echo "sweep=$sweep"
            echo "arm-stripe=$arm_stripe"
            echo "fuzz-seconds=$FUZZ_SECONDS"
          } >> "$GITHUB_OUTPUT"

  sweep:
    name: sweep (${{ matrix.function }}, stripe ${{ matrix.stripe }})
    needs: plan
    runs-on: ubuntu-latest
    # A shard of log1p, the slowest, is projected at under an hour with 4 shards (SKILLS.md).
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # The free organisation plan runs 20 jobs at once across vecbricks: with fuzz's 3, arm's 3
      # and proofs, this run takes at most 15, leaving room for CI.
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.sweep) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      # The machine in the log: CPU, vector flags, UseAVX and MaxVectorSize, and the datapath.
      - name: Record the machine
        continue-on-error: true
        run: bench/datapath.sh
      - name: Build
        run: mvn -B --no-transfer-progress -q test-compile
      - name: Sweep
        env:
          FUNCTION: ${{ matrix.function }}
          STRIPE: ${{ matrix.stripe }}
          SEED: ${{ needs.plan.outputs.seed }}
        run: dev/nightly.sh sweep "$FUNCTION" "stripe:$STRIPE" "$SEED"
      - name: Upload the logs and mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-sweep-${{ matrix.function }}-${{ strategy.job-index }}
          path: target/nightly/
          if-no-files-found: ignore

  fuzz:
    name: fuzz (${{ matrix.function }}, ${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        function: [exp, log, log1p]
        name: [runner flags, as AVX2]
        include:
          - name: runner flags
            jvm-args: ''
            salt: 1
          - name: as AVX2
            jvm-args: -XX:UseAVX=2 -XX:MaxVectorSize=32
            salt: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - name: Record the machine
        continue-on-error: true
        run: bench/datapath.sh
      - name: Build
        run: mvn -B --no-transfer-progress -q test-compile
      # Each job draws its own inputs: the night's seed plus the job's salt.
      - name: Fuzz
        env:
          FUNCTION: ${{ matrix.function }}
          SECONDS_EACH: ${{ needs.plan.outputs.fuzz-seconds }}
          SEED: ${{ needs.plan.outputs.seed }}
          SALT: ${{ matrix.salt }}
          NIGHTLY_JVM_ARGS: ${{ matrix.jvm-args }}
        run: |
          seed="$(printf '0x%016x' $((SEED + SALT)))"
          dev/nightly.sh fuzz "$FUNCTION" "$SECONDS_EACH" "$seed"
      - name: Upload the logs and mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-${{ matrix.function }}-${{ matrix.salt }}
          path: target/nightly/
          if-no-files-found: ignore

  arm:
    name: arm (${{ matrix.function }})
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        function: [exp, log, log1p]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - name: Record the machine
        continue-on-error: true
        run: bench/datapath.sh
      - name: Build
        run: mvn -B --no-transfer-progress -q test-compile
      - name: Sweep a stripe
        env:
          FUNCTION: ${{ matrix.function }}
          STRIPE: ${{ needs.plan.outputs.arm-stripe }}
          SEED: ${{ needs.plan.outputs.seed }}
        run: dev/nightly.sh sweep "$FUNCTION" "stripe:$STRIPE" "$SEED"
      - name: Fuzz
        if: ${{ !cancelled() }}
        env:
          FUNCTION: ${{ matrix.function }}
          SECONDS_EACH: ${{ needs.plan.outputs.fuzz-seconds }}
          SEED: ${{ needs.plan.outputs.seed }}
        run: |
          seed="$(printf '0x%016x' $((SEED + 3)))"
          dev/nightly.sh fuzz "$FUNCTION" "$SECONDS_EACH" "$seed"
      - name: Upload the logs and mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-arm-${{ matrix.function }}
          path: target/nightly/
          if-no-files-found: ignore

  # Every proof under Z3 and cvc5, each held to every expectation (proofs/README.md); ci.yml
  # runs them under Z3 only.
  proofs:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Z3 and cvc5
        run: dev/prove.sh --install both
      - name: Check the proofs under both solvers
        run: dev/prove.sh --solver both

  alert:
    needs: [plan, sweep, fuzz, arm, proofs]
    # A job past its timeout fails; a cancelled one is reported too, since nothing here cancels
    # a nightly by itself (cancel-in-progress is off).
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # No artifact at all (the plan failed) must not stop the issue from being opened.
      - name: Download the mismatches
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: nightly
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          SEED: ${{ needs.plan.outputs.seed }}
          RESULTS: >-
            plan=${{ needs.plan.result }} sweep=${{ needs.sweep.result }}
            fuzz=${{ needs.fuzz.result }} arm=${{ needs.arm.result }}
            proofs=${{ needs.proofs.result }}
        run: |
          body=body.md
          run_url="$SERVER/$GH_REPO/actions/runs/$RUN_ID"
          {
            echo "The nightly correctness run failed: $run_url"
            echo
            echo "Commit $SHA, seed \`${SEED:-none}\`. Jobs: $RESULTS."
            echo
            found=0
            for f in nightly/*/*.txt; do
              [ -f "$f" ] || continue
              total="$(sed -n 's/^# total mismatches: //p' "$f")"
              case "$total" in 0\ *|'') continue ;; esac
              found=1
              echo "### ${f#nightly/}"
              echo
              echo '```'
              grep -m1 '^# replay: ' "$f"
              echo "# total mismatches: $total"
              grep -m 20 -A1 '^# MISMATCH ' "$f" | grep -v '^--$'
              echo '```'
              echo
            done
            if [ "$found" = 0 ]; then
              echo "No mismatch file records a mismatch: a job failed for another reason (a"
              echo "build, a timeout, a proof). See the run's logs."
            else
              echo "Each artifact's .txt files hold the inputs, one per line, as"
              echo "src/test/resources/io/github/vecbricks/vfdlibm/hard-cases/<function>.txt"
              echo "takes them."
            fi
          } > "$body"
          # An issue body or comment holds at most 65536 characters.
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            head -c 60000 "$body" > body.cut
            printf '\n```\n\n(cut at 60000 characters; the artifacts hold the rest)\n' >> body.cut
            mv body.cut "$body"
          fi
          gh label create nightly-failure --color B60205 --force \
            --description "The nightly correctness run failed"
          open="$(gh issue list --label nightly-failure --state open --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$body"
          else
            gh issue create --title "Nightly correctness run failed" \
              --label nightly-failure --body-file "$body"
          fi
