name: Nightly

# The nightly correctness run (SKILLS.md, "The nightly sweep and fuzz"): every arm of exp,
# expm1, log, log10 and log1p, unmasked and masked, compared with StrictMath by raw bits.
#
# - sweep (x86): every one of the 2^32 high words with three low words each (Sweep.java) at
#   every width the drawn runner has except 128 bits: 256 and max on every draw, 512 on an
#   AVX-512 draw. Each function is split into `shards` stripes run as parallel jobs and rotated
#   over `nights` nights: night n (days since 1970 modulo `nights`) checks stripes n*shards to
#   n*shards+shards-1 of nights*shards. With the defaults, 1 night and 2 shards, all of it every
#   night. At 128 bits the same jobs sweep a rotating slice, 1/`slice-nights` of the high words
#   (default 32, all of them in 32 nights): x86 C2 lowers no two-lane mask, so 128 bits runs per
#   lane in Java and was 68 to 80% of a whole sweep's cost.
# - fuzz (x86): a fixed time per species, 128 bits included, from a fresh seed (Fuzz.java), at
#   the runner's own flags and compiled as an AVX2 host, as ci.yml's rows are.
# - arm: on an Arm runner, where 128 bits runs natively, every high word at 128 bits every
#   night (`arm-shards` stripes per function, the same `nights` rotation), the rotating slice
#   at max, and the fuzz at both.
# - proofs: every SMT proof under both solvers (proofs/README.md).
# - alert: when any of them fails, opens a GitHub issue labelled nightly-failure, or comments on
#   the open one, with the run's link, the dispatch inputs that replay it, and the mismatches. It
#   is the only job that may write.
#
# The seed is fresh each night; the plan job prints it with the night and slice night, and a
# dispatch with those inputs (as the issue lists them) replays every job of the run, Arm's too.
# Every mismatch file is uploaded as an artifact, its inputs one per line as
# hard-cases/<function>.txt takes them.
#
# The functions are named once, in the plan job, which makes every matrix; the input `functions`
# narrows them. The input `fault` plants a fault (Faults.java) in every sweep and fuzz JVM, so
# that a dispatch can show the night catching it and the alert job opening its issue, which is
# labelled nightly-fault-test and not nightly-failure:
#
#   gh workflow run nightly.yml -f fault=exp.dropCorrection -f functions=exp -f fuzz-seconds=5

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed, 0x and up to 16 hex digits; blank for a fresh one'
        required: false
        default: ''
      nights:
        description: 'Sweep: nights to cover every high word in, a power of two'
        required: false
        default: '1'
      shards:
        description: 'Sweep (x86): parallel jobs per function and night, a power of two to 32'
        required: false
        default: '2'
      arm-shards:
        description: 'Sweep (Arm): parallel jobs per function and night, a power of two to 32'
        required: false
        default: '4'
      night:
        description: 'Sweep: which night of the rotation, 0 to nights-1; blank for today'
        required: false
        default: ''
      slice-nights:
        description: 'Slice (x86 128 bits, Arm max): nights to cover it in, a power of two'
        required: false
        default: '32'
      slice-night:
        description: 'Slice: which night of its rotation, 0 to slice-nights-1; blank for today'
        required: false
        default: ''
      fuzz-seconds:
        description: 'Fuzz: seconds per function and species, 1 to 900'
        required: false
        default: '240'
      functions:
        description: 'Functions to run, separated by commas; blank for every one'
        required: false
        default: ''
      fault:
        description: 'Test of the alert only: a fault to plant, as exp.dropCorrection; else blank'
        required: false
        default: ''

permissions:
  contents: read

# The scheduled nights, the dispatches and the dispatches that plant a fault each have a group:
# in one group, a second dispatch would cancel a scheduled night that was waiting behind the
# first. A dispatch can then run beside a night, which the jobs' max-parallel does not count:
# narrow it with `functions`, or keep it clear of the night's hours.
concurrency:
  group: nightly-${{ github.event_name }}${{ inputs.fault && '-fault' || '' }}
  cancel-in-progress: false

jobs:
  plan:
    # Scheduled runs only in the main repository; a fork may still dispatch it.
    if: github.event_name != 'schedule' || github.repository == 'vecbricks/vfdlibm'
    runs-on: ubuntu-latest
    outputs:
      seed: ${{ steps.plan.outputs.seed }}
      sweep: ${{ steps.plan.outputs.sweep }}
      arm: ${{ steps.plan.outputs.arm }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      fuzz-seconds: ${{ steps.plan.outputs.fuzz-seconds }}
      fault: ${{ steps.plan.outputs.fault }}
      fault-args: ${{ steps.plan.outputs.fault-args }}
      fault-functions: ${{ steps.plan.outputs.fault-functions }}
      refused: ${{ steps.plan.outputs.refused }}
      replay: ${{ steps.plan.outputs.replay }}
    steps:
      # Only to check that a fault to plant is one pom.xml names.
      - uses: actions/checkout@v5
        if: ${{ inputs.fault != '' }}
      - name: Plan the night
        id: plan
        env:
          SEED: ${{ inputs.seed }}
          NIGHTS: ${{ inputs.nights || '1' }}
          SHARDS: ${{ inputs.shards || '2' }}
          ARM_SHARDS: ${{ inputs.arm-shards || '4' }}
          NIGHT: ${{ inputs.night }}
          SLICE_NIGHTS: ${{ inputs.slice-nights || '32' }}
          SLICE_NIGHT: ${{ inputs.slice-night }}
          FUZZ_SECONDS: ${{ inputs.fuzz-seconds || '240' }}
          FUNCTIONS: ${{ inputs.functions }}
          FAULT: ${{ inputs.fault }}
        run: |
          # Every function of the night: each matrix and each check below reads this list, so a
          # new port is added here (the comments that name the functions aside).
          all='exp expm1 log log10 log1p'
          pow2() { [[ $1 =~ ^[0-9]+$ ]] && [ "$1" -ge 1 ] && [ $(($1 & ($1 - 1))) -eq 0 ]; }
          # An input was refused: the output keeps the alert job from opening an issue for it.
          refused() { echo "refused=true" >> "$GITHUB_OUTPUT"; exit 1; }
          if [ -z "$SEED" ]; then
            SEED="0x$(od -An -N8 -tx8 /dev/urandom | tr -d ' \n')"
          elif ! [[ $SEED =~ ^0x[0-9a-fA-F]{1,16}$ ]]; then
            echo "::error::seed takes 0x and up to 16 hex digits, not '$SEED'"; refused
          fi
          # The functions input narrows the night; the night's order stays `all`'s.
          functions="$all"
          if [ -n "$FUNCTIONS" ]; then
            if ! [[ $FUNCTIONS =~ ^[a-z0-9]+(,[a-z0-9]+)*$ ]]; then
              echo "::error::functions takes names separated by commas, not '$FUNCTIONS'"; refused
            fi
            for f in ${FUNCTIONS//,/ }; do
              case " $all " in
                *" $f "*) ;;
                *) echo "::error::functions takes some of: $all; not '$f'"; refused ;;
              esac
            done
            functions=''
            for f in $all; do
              case ",$FUNCTIONS," in *",$f,"*) functions="$functions${functions:+ }$f" ;; esac
            done
          fi
          # A matrix holds at most 256 jobs, one per function and shard of the run: with all of
          # today's 5 functions 32 shards are 160, so the second check below starts to refuse
          # only when the list is longer. A stripe count (nights or slice-nights times shards) is
          # at most Sweep's 4096 chunks.
          count="$(wc -w <<< "$functions")"
          for n in "$NIGHTS" "$SLICE_NIGHTS"; do
            for s in "$SHARDS" "$ARM_SHARDS"; do
              if ! pow2 "$n" || ! pow2 "$s" || [ "$s" -gt 32 ] || [ $((n * s)) -gt 4096 ]; then
                echo "::error::nights, slice-nights and the shards take powers of two, the" \
                  "shards at most 32, a nights count times a shard count at most 4096"
                refused
              fi
              if [ $((count * s)) -gt 256 ]; then
                echo "::error::$s shards of $count functions are $((count * s)) jobs, past the" \
                  "256 a matrix holds"
                refused
              fi
            done
          done
          days=$(( $(date -u +%s) / 86400 ))
          if [ -z "$NIGHT" ]; then NIGHT=$((days % NIGHTS)); fi
          if [ -z "$SLICE_NIGHT" ]; then SLICE_NIGHT=$((days % SLICE_NIGHTS)); fi
          if ! [[ $NIGHT =~ ^[0-9]+$ ]] || [ "$NIGHT" -ge "$NIGHTS" ]; then
            echo "::error::night takes 0 to $((NIGHTS - 1)), not '$NIGHT'"; refused
          fi
          if ! [[ $SLICE_NIGHT =~ ^[0-9]+$ ]] || [ "$SLICE_NIGHT" -ge "$SLICE_NIGHTS" ]; then
            echo "::error::slice-night takes 0 to $((SLICE_NIGHTS - 1)), not '$SLICE_NIGHT'"
            refused
          fi
          # The fuzz job runs up to 4 species (128, 256, 512, max) in its 90 minutes.
          if ! [[ $FUZZ_SECONDS =~ ^[0-9]+$ ]] || [ "$FUZZ_SECONDS" -lt 1 ] \
              || [ "$FUZZ_SECONDS" -gt 900 ]; then
            echo "::error::fuzz-seconds takes 1 to 900, not '$FUZZ_SECONDS'"; refused
          fi
          # A planted fault is <function>.<what>, one of those pom.xml gives a fault run
          # (PlantedFaultTest holds that list to the ports' faults), and it must reach a function
          # this run checks. A mistyped name would plant nothing, and a fault that reaches no
          # function of the run would be planted where no job looks.
          # The functions a port's faults reach: its own, and every function that computes
          # through it. log10 computes through Log.logCore, where log's faults are.
          reach() {
            case "$1" in
              log) echo 'log log10' ;;
              *) echo "$1" ;;
            esac
          }
          fault_args=''
          fault_functions=''
          if [ -n "$FAULT" ]; then
            if ! [[ $FAULT =~ ^[a-z][a-z0-9]*\.[A-Za-z][A-Za-z0-9]*$ ]]; then
              echo "::error::fault takes <function>.<what>, not '$FAULT'"; refused
            fi
            case " $all " in
              *" ${FAULT%%.*} "*) ;;
              *) echo "::error::fault takes a fault of one of: $all; not '$FAULT'"; refused ;;
            esac
            for f in $(reach "${FAULT%%.*}"); do
              case " $functions " in
                *" $f "*) fault_functions="$fault_functions${fault_functions:+ }$f" ;;
              esac
            done
            if [ -z "$fault_functions" ]; then
              echo "::error::the fault '$FAULT' reaches no function of this run ($functions)"
              refused
            fi
            if ! grep -qF -- "-Dvfdlibm.fault=$FAULT</argLine>" pom.xml; then
              echo "::error::pom.xml has no fault run for '$FAULT'"; refused
            fi
            fault_args="-Dvfdlibm.fault=$FAULT"
          fi
          # One matrix entry per function and shard: the whole-sweep stripe, the slice's stripe
          # and the species the slice takes; on Arm the first shard also fuzzes.
          matrix() {
            local shards="$1" slice_species="$2" json='{"include":[' sep='' f j fuzz
            for f in $functions; do
              for ((j = 0; j < shards; j++)); do
                if [ "$j" = 0 ]; then fuzz=true; else fuzz=false; fi
                json="$json$sep{\"function\":\"$f\",\"shard\":$j"
                json="$json,\"stripe\":\"$((NIGHT * shards + j))/$((NIGHTS * shards))\""
                json="$json,\"slice\":\"$((SLICE_NIGHT * shards + j))/$((SLICE_NIGHTS * shards))\""
                json="$json,\"slice-species\":\"$slice_species\",\"fuzz\":$fuzz}"
                sep=','
              done
            done
            echo "$json]}"
          }
          # The fuzz: each function at the runner's own flags and compiled as an AVX2 host. The
          # salt gives each job its own inputs and names its artifact.
          fuzz_matrix() {
            local json='{"include":[' sep='' f
            for f in $functions; do
              json="$json$sep{\"function\":\"$f\",\"name\":\"runner flags\""
              json="$json,\"jvm-args\":\"\",\"salt\":1}"
              json="$json,{\"function\":\"$f\",\"name\":\"as AVX2\""
              json="$json,\"jvm-args\":\"-XX:UseAVX=2 -XX:MaxVectorSize=32\",\"salt\":2}"
              sep=','
            done
            echo "$json]}"
          }
          replay="seed=$SEED nights=$NIGHTS shards=$SHARDS arm-shards=$ARM_SHARDS"
          replay="$replay night=$NIGHT slice-nights=$SLICE_NIGHTS slice-night=$SLICE_NIGHT"
          replay="$replay fuzz-seconds=$FUZZ_SECONDS"
          if [ "$functions" != "$all" ]; then replay="$replay functions=${functions// /,}"; fi
          if [ -n "$FAULT" ]; then replay="$replay fault=$FAULT"; fi
          echo "replay with the dispatch inputs: $replay"
          echo "sweep: night $NIGHT of $NIGHTS; x86 stripes $((NIGHT * SHARDS)) to" \
            "$((NIGHT * SHARDS + SHARDS - 1)) of $((NIGHTS * SHARDS)), Arm stripes" \
            "$((NIGHT * ARM_SHARDS)) to $((NIGHT * ARM_SHARDS + ARM_SHARDS - 1)) of" \
            "$((NIGHTS * ARM_SHARDS)) per function"
          echo "slice (x86 128 bits, Arm max): night $SLICE_NIGHT of $SLICE_NIGHTS"
          echo "fuzz: $FUZZ_SECONDS s per function and species"
          echo "functions: $functions"
          if [ -n "$FAULT" ]; then
            echo "::warning::the fault $FAULT is planted in every sweep and fuzz: this run tests" \
              "the alert, and its mismatches of $fault_functions are not the library's"
          fi
          {
            echo "seed=$SEED"
            echo "sweep=$(matrix "$SHARDS" 128)"
            echo "arm=$(matrix "$ARM_SHARDS" max)"
            echo "fuzz=$(fuzz_matrix)"
            echo "fuzz-seconds=$FUZZ_SECONDS"
            echo "fault=$FAULT"
            echo "fault-args=$fault_args"
            echo "fault-functions=$fault_functions"
            echo "replay=$replay"
          } >> "$GITHUB_OUTPUT"

  sweep:
    name: sweep (${{ matrix.function }}, stripe ${{ matrix.stripe }})
    needs: plan
    runs-on: ubuntu-latest
    # A job of log1p, the slowest, is projected at 15 to 30 minutes with 2 shards (SKILLS.md).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The free organisation plan runs 20 jobs at once across vecbricks: with fuzz's 3, arm's 4
      # and proofs, this run takes at most 16, leaving room for CI.
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.sweep) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      # The machine in the log: CPU, vector flags, UseAVX and MaxVectorSize, and the datapath.
      - name: Record the machine
        continue-on-error: true
        run: bench/datapath.sh
      - name: Build
        run: mvn -B --no-transfer-progress -q test-compile
      - name: Sweep every high word of the stripe at the wide species
        env:
          FUNCTION: ${{ matrix.function }}
          STRIPE: ${{ matrix.stripe }}
          NIGHTLY_EXCEPT: ${{ matrix.slice-species }}
          SEED: ${{ needs.plan.outputs.seed }}
          NIGHTLY_JVM_ARGS: ${{ needs.plan.outputs.fault-args }}
        run: dev/nightly.sh sweep "$FUNCTION" "stripe:$STRIPE" "$SEED"
      - name: Sweep the slice at 128 bits
        if: ${{ !cancelled() }}
        env:
          FUNCTION: ${{ matrix.function }}
          STRIPE: ${{ matrix.slice }}
          SLICE_SPECIES: ${{ matrix.slice-species }}
          SEED: ${{ needs.plan.outputs.seed }}
          NIGHTLY_JVM_ARGS: ${{ needs.plan.outputs.fault-args }}
        run: dev/nightly.sh sweep "$FUNCTION" "stripe:$STRIPE" "$SEED" "$SLICE_SPECIES"
      - name: Upload the logs and mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-sweep-${{ matrix.function }}-${{ matrix.shard }}
          path: target/nightly/
          if-no-files-found: ignore

  fuzz:
    name: fuzz (${{ matrix.function }}, ${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    # Up to 4 species times fuzz-seconds: 16 minutes by default, 60 at the cap of 900.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - name: Record the machine
        continue-on-error: true
        run: bench/datapath.sh
      - name: Build
        run: mvn -B --no-transfer-progress -q test-compile
      # Each job draws its own inputs: the night's seed plus the job's salt.
      - name: Fuzz
        env:
          FUNCTION: ${{ matrix.function }}
          SECONDS_EACH: ${{ needs.plan.outputs.fuzz-seconds }}
          SEED: ${{ needs.plan.outputs.seed }}
          SALT: ${{ matrix.salt }}
          NIGHTLY_JVM_ARGS: ${{ matrix.jvm-args }} ${{ needs.plan.outputs.fault-args }}
        run: |
          seed="$(printf '0x%016x' $((SEED + SALT)))"
          dev/nightly.sh fuzz "$FUNCTION" "$SECONDS_EACH" "$seed"
      - name: Upload the logs and mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-${{ matrix.function }}-${{ matrix.salt }}
          path: target/nightly/
          if-no-files-found: ignore

  arm:
    name: arm (${{ matrix.function }}, stripe ${{ matrix.stripe }})
    needs: plan
    runs-on: ubuntu-24.04-arm
    # Bounded by the laptop's x86 per-lane 128-bit time, a job of log1p sweeps for at most 26
    # minutes with 4 shards, and the first shard fuzzes for 2 species times fuzz-seconds, 30
    # minutes at the cap (SKILLS.md).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.arm) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - name: Record the machine
        continue-on-error: true
        run: bench/datapath.sh
      - name: Build
        run: mvn -B --no-transfer-progress -q test-compile
      - name: Sweep every high word of the stripe at 128 bits
        env:
          FUNCTION: ${{ matrix.function }}
          STRIPE: ${{ matrix.stripe }}
          NIGHTLY_EXCEPT: ${{ matrix.slice-species }}
          SEED: ${{ needs.plan.outputs.seed }}
          NIGHTLY_JVM_ARGS: ${{ needs.plan.outputs.fault-args }}
        run: dev/nightly.sh sweep "$FUNCTION" "stripe:$STRIPE" "$SEED"
      - name: Sweep the slice at max
        if: ${{ !cancelled() }}
        env:
          FUNCTION: ${{ matrix.function }}
          STRIPE: ${{ matrix.slice }}
          SLICE_SPECIES: ${{ matrix.slice-species }}
          SEED: ${{ needs.plan.outputs.seed }}
          NIGHTLY_JVM_ARGS: ${{ needs.plan.outputs.fault-args }}
        run: dev/nightly.sh sweep "$FUNCTION" "stripe:$STRIPE" "$SEED" "$SLICE_SPECIES"
      - name: Fuzz
        if: ${{ !cancelled() && matrix.fuzz }}
        env:
          FUNCTION: ${{ matrix.function }}
          SECONDS_EACH: ${{ needs.plan.outputs.fuzz-seconds }}
          SEED: ${{ needs.plan.outputs.seed }}
          NIGHTLY_JVM_ARGS: ${{ needs.plan.outputs.fault-args }}
        run: |
          seed="$(printf '0x%016x' $((SEED + 3)))"
          dev/nightly.sh fuzz "$FUNCTION" "$SECONDS_EACH" "$seed"
      - name: Upload the logs and mismatches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-arm-${{ matrix.function }}-${{ matrix.shard }}
          path: target/nightly/
          if-no-files-found: ignore

  # Every proof under Z3 and cvc5, each held to every expectation (proofs/README.md); ci.yml
  # runs them under Z3 only.
  proofs:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Z3 and cvc5
        run: dev/prove.sh --install both
      - name: Check the proofs under both solvers
        run: dev/prove.sh --solver both

  # A run with a planted fault must record a mismatch in a function the fault reaches. A job
  # that failed for another reason (a build, a timeout) is no catch, so this job reads the
  # mismatch files and not the jobs' results. It fails when those files record none and at
  # least one of them is a JVM's whole clean run, so that a missed fault is a red run and the
  # alert job says so; a run that was cut short, or where no JVM finished, decides nothing.
  fault-caught:
    needs: [plan, sweep, fuzz, arm]
    if: always() && needs.plan.outputs.fault != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download the mismatches
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: nightly
      - name: Require a mismatch of a function the fault reaches
        env:
          FAULT: ${{ needs.plan.outputs.fault }}
          FAULT_FUNCTIONS: ${{ needs.plan.outputs.fault-functions }}
          RESULTS: >-
            sweep=${{ needs.sweep.result }} fuzz=${{ needs.fuzz.result }}
            arm=${{ needs.arm.result }}
        run: |
          echo "jobs: $RESULTS"
          caught=0
          clean=0
          for f in $FAULT_FUNCTIONS; do
            # An artifact's files are <mode>-<function>-<species>.txt.
            for file in nightly/nightly-*/*-"$f"-*.txt; do
              [ -f "$file" ] || continue
              # As the alert job counts: a JVM that was stopped wrote no total.
              total="$(sed -n 's/^# total mismatches: //p' "$file")"
              written="$(grep -c '^# MISMATCH ' "$file" || true)"
              case "$total" in 0\ *) clean=$((clean + 1)); continue ;; esac
              if [ -z "$total" ] && [ "$written" = 0 ]; then continue; fi
              echo "caught in ${file#nightly/}: ${total:-$written written, the JVM was stopped}"
              caught=$((caught + 1))
            done
          done
          if [ "$caught" -gt 0 ]; then
            echo "the planted fault $FAULT was caught in $caught mismatch files"
            exit 0
          fi
          case "$RESULTS" in *=cancelled*|*=skipped*) clean=0 ;; esac
          if [ "$clean" = 0 ]; then
            echo "::warning::no mismatch of $FAULT_FUNCTIONS is recorded, but the run was cut" \
              "short or no JVM of them finished: whether the fault $FAULT would be caught is" \
              "not decided"
            exit 0
          fi
          echo "::error::$clean JVMs of $FAULT_FUNCTIONS finished and none records a mismatch:" \
            "the planted fault $FAULT was not caught"
          exit 1

  alert:
    needs: [plan, sweep, fuzz, arm, proofs, fault-caught]
    # A job past its timeout fails; a cancelled one is reported too, since nothing here cancels
    # a nightly by itself (cancel-in-progress is off).
    # A run whose plan job refused its inputs opens no issue: the run's own error says so to
    # whoever dispatched it. A plan job that failed for any other reason is reported.
    if: >-
      always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
      && needs.plan.outputs.refused != 'true'
    runs-on: ubuntu-latest
    # One at a time: two runs that fail together must not both find no open issue and each
    # open one.
    concurrency:
      group: nightly-alert
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      # No artifact at all (the plan failed) must not stop the issue from being opened.
      - name: Download the mismatches
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: nightly
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          SEED: ${{ needs.plan.outputs.seed }}
          REPLAY: ${{ needs.plan.outputs.replay }}
          # The plan job's outputs are empty when it failed before its end; the input still
          # says that a fault was asked for, which decides the label.
          FAULT: ${{ needs.plan.outputs.fault || inputs.fault }}
          FAULT_FUNCTIONS: ${{ needs.plan.outputs.fault-functions }}
          FAULT_CAUGHT: ${{ needs.fault-caught.result }}
          RESULTS: >-
            plan=${{ needs.plan.result }} sweep=${{ needs.sweep.result }}
            fuzz=${{ needs.fuzz.result }} arm=${{ needs.arm.result }}
            proofs=${{ needs.proofs.result }}
        run: |
          body=body.md
          run_url="$SERVER/$GH_REPO/actions/runs/$RUN_ID"
          # A run with a planted fault has a label and so an issue of its own: a night's failure
          # is never a comment under a test's issue, nor a test under a night's failure. What
          # else fails in a run with a fault is reported under the test's label, and the body
          # says how to tell it from the fault.
          label=nightly-failure
          about="The nightly correctness run failed"
          title="Nightly correctness run failed"
          if [ -n "$FAULT" ]; then
            label=nightly-fault-test
            about="A nightly run with a planted fault, a test of the alert job"
            title="Nightly run with a planted fault (a test of the alert job)"
          fi
          missed=0
          reached="$FAULT_FUNCTIONS"
          if [ -n "$FAULT" ]; then
            RESULTS="$RESULTS fault-caught=$FAULT_CAUGHT"
            if [ "$FAULT_CAUGHT" = failure ]; then missed=1; fi
            # The plan job did not get as far as saying which functions the fault reaches.
            if [ -z "$reached" ]; then reached="${FAULT%%.*}"; fi
          fi
          # One mismatch file's section: its replay, its totals and its first mismatches.
          section() {
            local f="$1" total="$2" written="$3"
            echo "### ${f#nightly/}"
            echo
            echo '```'
            grep -m1 '^# replay: ' "$f"
            grep -m1 '^# jvm args: ' "$f" || true
            echo "# total mismatches: ${total:-none written, the JVM was stopped}"
            echo "# mismatches written to the file: $written"
            grep -m 20 -A1 '^# MISMATCH ' "$f" | grep -v '^--$'
            echo '```'
            echo
          }
          {
            # Said first, so that a test of this job is not read as a failure of the library.
            if [ -n "$FAULT" ]; then
              echo "**A test of the alert job.** The run was dispatched with the fault"
              echo "\`$FAULT\` planted (\`-Dvfdlibm.fault=$FAULT\`) in every sweep and fuzz."
              echo "Mismatches of ${reached// / and } are expected and are not the library's;"
              echo "they are listed last. Anything else that failed is a failure to look into:"
              echo "a mismatch of another function, which comes first below; the proofs; and a"
              echo "job that failed without a mismatch, which the results here cannot show, since"
              echo "the sweep, the fuzz and Arm fail under the fault by design: the run's page"
              echo "names each failed job with its function."
              echo
              if [ "$missed" = 1 ]; then
                echo "**The planted fault was not caught**: JVMs of ${reached// / and } ran to"
                echo "their end and no mismatch file of theirs records a mismatch"
                echo "(\`fault-caught=failure\`)."
                echo
              fi
              echo "The run: $run_url"
            else
              echo "The nightly correctness run failed: $run_url"
            fi
            echo
            echo "Commit $SHA, seed \`${SEED:-none}\`. Jobs: $RESULTS."
            echo
            echo "Replay: dispatch nightly.yml at $SHA with \`${REPLAY:-none}\`."
            echo
            # The files of a planted fault's functions are set aside, one line each and the first
            # in full, so that their number cannot push another function's mismatch past the
            # cut below.
            found=0
            expected=0
            first=''
            : > expected.md
            for f in nightly/*/*.txt; do
              [ -f "$f" ] || continue
              total="$(sed -n 's/^# total mismatches: //p' "$f")"
              # A JVM killed by a timeout or a cancel writes no total, but every mismatch it
              # wrote is flushed: those count too.
              written="$(grep -c '^# MISMATCH ' "$f" || true)"
              case "$total" in 0\ *) continue ;; esac
              if [ -z "$total" ] && [ "$written" = 0 ]; then continue; fi
              # A file is <mode>-<function>-<species>.txt.
              fn="${f##*/}"; fn="${fn#*-}"; fn="${fn%-*}"
              if [ -n "$FAULT" ] && [[ " $reached " == *" $fn "* ]]; then
                expected=$((expected + 1))
                if [ -z "$first" ]; then first="$f"; fi
                echo "- \`${f#nightly/}\`: ${total:-$written written, the JVM was stopped}" \
                  >> expected.md
                continue
              fi
              found=1
              section "$f" "$total" "$written"
            done
            if [ -n "$FAULT" ]; then
              if [ "$found" = 0 ]; then
                echo "No mismatch file of another function records a mismatch."
                echo
              fi
              if [ "$expected" -gt 0 ]; then
                echo "### Expected under the planted fault: $expected mismatch files"
                echo
                cat expected.md
                echo
                echo "The first of them:"
                echo
                total="$(sed -n 's/^# total mismatches: //p' "$first")"
                section "$first" "$total" "$(grep -c '^# MISMATCH ' "$first" || true)"
              fi
            fi
            if [ "$found" = 0 ] && [ "$expected" = 0 ] && [ "$missed" = 1 ]; then
              echo "No mismatch file records a mismatch: the planted fault was not caught. See"
              echo "the run's logs for whether anything else failed."
            elif [ "$found" = 0 ] && [ "$expected" = 0 ]; then
              echo "No mismatch file records a mismatch: a job failed for another reason (a"
              echo "build, a timeout, a proof). See the run's logs."
            else
              echo "Each artifact's .txt files hold the inputs, one per line, as"
              echo "src/test/resources/io/github/vecbricks/vfdlibm/hard-cases/<function>.txt"
              echo "takes them."
            fi
          } > "$body"
          # An issue body or comment holds at most 65536 characters.
          # Close the fence only when the cut falls inside one (an odd count of fence lines).
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            head -c 60000 "$body" > body.cut
            fences="$(grep -c '^```$' body.cut || true)"
            if [ $((fences % 2)) -eq 1 ]; then
              printf '\n```\n' >> body.cut
            fi
            printf '\n(cut at 60000 characters; the artifacts hold the rest)\n' >> body.cut
            mv body.cut "$body"
          fi
          gh label create "$label" --color B60205 --force --description "$about"
          open="$(gh issue list --label "$label" --state open --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$body"
          else
            gh issue create --title "$title" --label "$label" --body-file "$body"
          fi
