name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls these jobs as its gates, since a tag does not start this workflow.
  workflow_call:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86 at whatever width the drawn runner has. GitHub's x86 runners are a mix: the AMD
          # EPYC 7763 is AVX2 (preferred species 256 bits, the 512-bit cases skipped), while some
          # draws are AVX-512 hosts such as an Intel Xeon 6973P-C, which run the 512-bit cases
          # too and prefer 512 bits. The 128- and 256-bit cases run on every draw.
          - name: x86 128+256 bits, 512 on AVX-512 runners
            os: ubuntu-latest
            jvm-args: ""
            # The one row that also runs the jar check's self-test.
            jar-self-test: true
          # x86 compiled as an AVX2 host, the headline EPYC 7763, whatever runner is drawn:
          # UseAVX=2 caps vectors at 256 bits and takes AVX-512's instructions away, so the
          # preferred species is 256 bits on every draw, and an operation C2 lowers only with
          # AVX-512 (D2L and L2D need AVX512DQ) runs its Java fallback, whose bits count too.
          - name: x86 as AVX2, 128+256 bits
            os: ubuntu-latest
            jvm-args: -XX:UseAVX=2 -XX:MaxVectorSize=32
          # x86 with vectors capped at 16 bytes: every case runs at 128 bits (the preferred
          # species is 128 bits too), and the 256- and 512-bit cases are skipped.
          - name: x86 128 bits
            os: ubuntu-latest
            jvm-args: -XX:MaxVectorSize=16
          # Arm: GitHub's Arm runners have 128-bit vectors, so the 128-bit and preferred cases
          # run there and the 256- and 512-bit cases are skipped.
          - name: Arm 128 bits
            os: ubuntu-24.04-arm
            jvm-args: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      - name: Build and test
        run: >-
          mvn -B --no-transfer-progress verify
          "-Dvfdlibm.test.jvmArgs=${{ matrix.jvm-args }}"
      # The jars a release uploads, less their signatures (the release profile adds the sources
      # jar and the Javadoc jar to the jar verify built; the tests have just run), and then the
      # jar read as a consumer has it: its licence files (the other two jars' too, which
      # --release requires to be there), its module name, its classes, and a consumer compiled
      # against it alone, which runs under this row's JVM options as the tests did. The
      # row marked jar-self-test then runs the same script on copies of the jar with one defect
      # each, every one of which it must fail; once is enough, since that tests the script and
      # not the jar.
      - name: Check the jar from outside
        env:
          JVM_ARGS: ${{ matrix.jvm-args }}
          JAR_SELF_TEST: ${{ matrix.jar-self-test }}
        run: |
          mvn -B --no-transfer-progress -Prelease -Dgpg.skip=true -DskipTests package
          JAVA_TOOL_OPTIONS="$JVM_ARGS" dev/jar-check.sh --release
          if [ "$JAR_SELF_TEST" = true ]; then
            dev/jar-check.sh --self-test
          fi

  # The SMT proofs under proofs/ (proofs/README.md), under the pinned Z3 that dev/prove.sh
  # installs into target/solvers/ from PyPI's z3-solver wheel. --self-test shows the checker of
  # verdicts catches a planted failure of each kind; --lint runs every proof, each under Z3 unless
  # the script's CVC5_IN_LINT names it. No JVM: the solvers are development tools, not part of
  # the build. Every proof under both solvers runs in nightly.yml's proofs job.
  proofs:
    name: proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # dev/prove.sh installs Z3 into a venv of its own.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Z3
        run: dev/prove.sh --install z3
      - name: Check the checker of verdicts
        run: dev/prove.sh --self-test
      - name: Check the proofs
        run: dev/prove.sh --lint

  # A boxed vector body computes the right bits, so the tests pass on it; only its allocation
  # shows that the Vector API fell back to Java. bench/alloc-check.py runs every vector
  # benchmark named *256 or *Preferred under JMH's -prof gc, with the body inlined, and fails if
  # any row allocates 1 B/op or more. It runs at the runner's own flags (AVX2 on an EPYC 7763,
  # AVX-512 on the draws that have it, where the preferred arm is 512 bits) and as an AVX2 host
  # on every draw, where D2L and L2D box.
  #
  # The Arm row is a trial (issue 37): the check has not been shown to hold at the Arm runners'
  # 128-bit vectors (SKILLS.md), so the row may fail without failing the workflow. It runs the
  # *Preferred rows only, which are 128 bits there; a *256 row would run in the Java fallback,
  # as 512 bits does on an AVX2 host. When a row fails, the next step runs that row again with
  # C2 printing what it did not intrinsify or inline.
  alloc:
    name: alloc (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.trial }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86 runner flags
            os: ubuntu-latest
            jvm-args: ""
            include: ""
            trial: false
          - name: x86 as AVX2
            os: ubuntu-latest
            jvm-args: -XX:UseAVX=2 -XX:MaxVectorSize=32
            include: ""
            trial: false
          - name: Arm 128 bits, trial
            os: ubuntu-24.04-arm
            jvm-args: ""
            include: .*Benchmark\.(?!\w*Boxed)\w+Preferred$
            trial: true
    env:
      JVM_ARGS: ${{ matrix.jvm-args }}
      INCLUDE: ${{ matrix.include }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      # The trial row names its machine, so its reading can be quoted. The probe's exit status
      # is not a gate here: with 128-bit vectors only it has no 256:128 control to read.
      - name: Record the machine
        if: matrix.trial
        run: bench/datapath.sh || true
      - name: Check that no vector body allocates
        run: |
          if [ -n "$INCLUDE" ]; then
            bench/alloc-check.py --jvm-args "$JVM_ARGS" --include "$INCLUDE"
          else
            bench/alloc-check.py --jvm-args "$JVM_ARGS"
          fi
      # Each failing row again, one short fork, with C2's own account: the lines of
      # PrintIntrinsics and PrintInlining that SKILLS.md says how to read, counted. Of the
      # refused calls only the library's and VectorSupport's are kept; the JDK's own are many
      # and box nothing.
      - name: Ask C2 what it refused in each failing row
        if: failure() && matrix.trial
        run: |
          python3 - > failing.txt <<'PY'
          import json
          for row in json.load(open("target/alloc-check.json")):
              norm = [m for k, m in row["secondaryMetrics"].items()
                      if k.endswith("gc.alloc.rate.norm")][0]
              if max(v for fork in norm["rawData"] for v in fork) >= 1.0:
                  print(row["benchmark"], row["params"]["inputs"])
          PY
          cp target/alloc-check.json alloc-check.json
          flags="-XX:CompileCommand=inline,io.github.vecbricks.vfdlibm.*::*"
          flags="$flags -XX:CompileCommand=PrintIntrinsics,io.github.vecbricks.vfdlibm.*::*"
          flags="$flags -XX:+UnlockDiagnosticVMOptions -XX:+PrintInlining $JVM_ARGS"
          while read -r row inputs; do
            echo "::group::$row [inputs=$inputs]"
            options="-p inputs=$inputs -f 1 -wi 3 -w 1s -i 1 -r 1s -prof gc"
            mvn -B --no-transfer-progress -q -Pjmh test-compile exec:exec \
              "-Djmh.args=$row\$ $options -jvmArgsAppend \"$flags\"" > c2.txt 2>&1 || true
            count() { sed -E 's/^ +//; s/ +/ /g' | sort | uniq -c | sort -rn | head -80; }
            echo "PrintIntrinsics, each distinct line with its count:"
            grep -E 'not supported|missing constant|unbox failed' c2.txt | count
            echo "PrintInlining, the refused calls of the library and of the Vector API:"
            grep -E 'failed to inline' c2.txt \
              | grep -E 'vfdlibm|VectorSupport|NodeCountInliningCutoff' | count
            grep -E 'gc.alloc.rate.norm' c2.txt | tail -1
            echo "::endgroup::"
          done < failing.txt
      - name: Keep the trial row's result
        if: always() && matrix.trial
        uses: actions/upload-artifact@v4
        with:
          name: alloc-check-arm
          path: |
            target/alloc-check.json
            alloc-check.json
          if-no-files-found: warn

  # The self-tests of the benchmark scripts, which no build runs: bench/host.sh's table of
  # benchmark hosts against the machines the runner pool gives (the CPU check of
  # benchmark.yml), and bench/pair.py's verdicts. No JVM.
  bench-scripts:
    name: bench scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the table of benchmark hosts
        run: bench/host.sh --self-test
      - name: Check the pair's verdicts
        run: bench/pair.py --selftest
