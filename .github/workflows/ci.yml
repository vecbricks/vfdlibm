name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      # GitHub's runners are AVX2, so the tests' 512-bit cases are skipped here, not run; an
      # AVX-512 host runs them.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
