name: Benchmark

# A JMH run on one of four named benchmark hosts, GitHub-hosted runners drawn from the standard
# ubuntu-latest pool (SKILLS.md, "Where headline numbers come from"): the Intel Xeon Platinum
# 8573C and the Intel Xeon 6973P-C (AVX-512), the AMD EPYC 9V45 (Zen 5, full-width AVX-512, a
# rare draw that nobody waits for) and the AMD EPYC 7763 (Zen 3, AVX2). Dispatch it with
# bench/dispatch-bench.sh, which dispatches again an hour later whenever a run fails the CPU
# check (a bounded number of times for the 9V45). The host input picks one of the four; each
# host's CPU string is fixed below, on purpose, with no free-text input to change it: a run on
# another CPU is not comparable with the results before it.
#
# With a base, the job is a pair instead (bench/pair.sh): the benchmarks on the base and on the
# head in alternating rounds on this one machine, and a verdict per row.

# A dispatcher's tag, when given, goes into the run's name so the dispatcher can find its own run
# among others on the same branch; it changes nothing else.
run-name: ${{ inputs.run-tag && format('Benchmark {0}', inputs.run-tag) || 'Benchmark' }}

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Benchmark host; the run fails its CPU check on any other CPU'
        type: choice
        required: true
        default: epyc7763
        options:
          - epyc7763
          - xeon8573c
          - xeon6973p
          - epyc9v45
      benchmarks:
        description: 'JMH benchmark regex, e.g. "ExpBenchmark" or "ExpBenchmark.finish256"'
        required: true
        default: 'ExpBenchmark'
      jvm-args:
        description: 'Extra JVM options for the forked benchmark JVMs, e.g. "-XX:MaxVectorSize=16"'
        required: false
        default: ''
      base:
        description: 'Blank for one run; else a pair against this base: branch, commit or HEAD'
        required: false
        default: ''
      rounds:
        description: 'Pair only: at most this many rounds (each runs base and head once)'
        required: false
        default: '5'
      threshold:
        description: 'Pair only: a row slower by this many percent by median and best fails'
        required: false
        default: '10'
      run-tag:
        description: 'Free text for the run name only; bench/dispatch-bench.sh finds its run by it'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      JMH_OPTIONS: -f 2 -wi 3 -w 2s -i 5 -r 2s -prof gc
      INLINE: -XX:CompileCommand=inline,io.github.vecbricks.vfdlibm.*::*
    steps:
      # First, before any setup: a job checks its own machine, since every job is a new VM.
      # bench/dispatch-bench.sh looks for this step's exact name among a failed run's failed
      # steps. Each host's string is a substring of /proc/cpuinfo's model name as runs of that
      # host printed it (SKILLS.md names the runs); the match ignores case, since Azure VMs have
      # reported Intel names in capitals ("INTEL(R) XEON(R) PLATINUM 8573C").
      - name: Probe the machine's CPU
        env:
          HOST: ${{ inputs.host }}
        run: |
          case "$HOST" in
            epyc7763) expected='AMD EPYC 7763' ;;
            xeon8573c) expected='INTEL(R) XEON(R) PLATINUM 8573C' ;;
            xeon6973p) expected='Intel(R) Xeon(R) 6973P-C' ;;
            epyc9v45) expected='AMD EPYC 9V45' ;;
            *) echo "::error::Unknown host '$HOST'"; exit 1 ;;
          esac
          cpu="$(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')"
          echo "Host: $HOST, CPU: $cpu"
          if ! echo "$cpu" | grep -qiF "$expected"; then
            echo "::error::CPU mismatch on host $HOST! Expected '$expected' but got '$cpu'"
            exit 1
          fi
          echo "EXPECTED_CPU=$expected" >> "$GITHUB_ENV"
      # A pair needs the base's commits too, so it takes the whole history.
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.base != '' && '0' || '1' }}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      # The datapath probe (bench/datapath.sh) at the machine's own JVM flags, so its reading is
      # comparable with HARDWARE.md's rows. It records and never gates: the CPU check above is
      # the only gate, and a probe that fails leaves "not measured" in the header.
      - name: Measure the vector datapath
        continue-on-error: true
        run: bench/datapath.sh | tee datapath.txt
      - name: Run JMH
        if: inputs.base == ''
        env:
          BENCHMARKS: ${{ inputs.benchmarks }}
          HOST: ${{ inputs.host }}
          JVM_ARGS: ${{ inputs.jvm-args }}
        run: |
          set -o pipefail
          out=bench-results.txt
          flags="$(grep -m1 '^flags' /proc/cpuinfo)"
          has() { if grep -qw "$1" <<<"$flags"; then echo yes; else echo no; fi; }
          datapath="$(sed -n 's/^datapath: //p' datapath.txt 2>/dev/null)"
          append="$INLINE"
          if [ -n "$JVM_ARGS" ]; then append="$JVM_ARGS $INLINE"; fi
          {
            echo "# $BENCHMARKS on a GitHub runner, $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "#"
            echo "# Host:        $HOST (expected CPU '$EXPECTED_CPU')"
            echo "# Commit:      $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "# Run:         $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "# JDK:         $(java -version 2>&1 | tail -n 1)"
            echo "# CPU:         $(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')"
            echo "# AVX-512:     avx512f=$(has avx512f) avx512dq=$(has avx512dq)"
            echo "# CPU flags:   $(tr ' ' '\n' <<<"$flags" | grep -E '^avx' | sort -u \
              | tr '\n' ' ')"
            # shellcheck disable=SC2086 # the extra JVM options are words
            echo "# Vector:      $(java $JVM_ARGS -XX:+PrintFlagsFinal -version 2>/dev/null \
              | grep -E ' (MaxVectorSize|UseAVX) ' | awk '{print $2 "=" $4}' | tr '\n' ' ')"
            echo "# Datapath:    ${datapath:-not measured: the probe failed, see its step}"
            echo "#              (bench/datapath.sh, at the machine's own JVM flags)"
            echo "# Kernel:      $(uname -r)"
            echo "# Load:        $(cut -d ' ' -f 1-3 /proc/loadavg) at start ($(nproc) cores)"
            echo "# JMH:         $JMH_OPTIONS -jvmArgsAppend \"$append\""
            echo "# Command:     mvn -B -Pjmh test-compile exec:exec -Djmh.args=\"<the above>\""
            echo "#"
          } > "$out"
          cat "$out"
          mvn -B --no-transfer-progress -Pjmh test-compile exec:exec \
            "-Djmh.args=$BENCHMARKS $JMH_OPTIONS -jvmArgsAppend \"$append\"" | tee -a "$out"
          echo "# Load:        $(cut -d ' ' -f 1-3 /proc/loadavg) at end" >> "$out"
      # A pair: the same JMH options on the base and the head, alternating, on this one machine.
      # bench/pair.sh writes its own results file, in the same provenance format, with this
      # run's datapath reading and both commits in its header.
      - name: Run the pair
        if: inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
          BENCHMARKS: ${{ inputs.benchmarks }}
          HOST: ${{ inputs.host }}
          JVM_ARGS: ${{ inputs.jvm-args }}
          ROUNDS: ${{ inputs.rounds }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          set -o pipefail
          # A branch name resolves through the checkout's remote-tracking refs.
          if ! base="$(git rev-parse -q --verify "$BASE^{commit}")" \
              && ! base="$(git rev-parse -q --verify "origin/$BASE^{commit}")"; then
            echo "::error::base '$BASE' is neither a commit nor a branch of this repository"
            exit 1
          fi
          bench/pair.sh --base "$base" --rounds "$ROUNDS" --threshold "$THRESHOLD" \
            --host "$HOST" --jvm-args "$JVM_ARGS" --datapath datapath.txt \
            --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out pair --result bench-results.txt "$BENCHMARKS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            bench-results.txt
            datapath.txt
            pair/
          if-no-files-found: ignore
