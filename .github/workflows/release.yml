name: Release dry run

# A DRY RUN OF A RELEASE, AND NOTHING MORE. This workflow never publishes, never uploads, holds
# no secret and uses no GitHub environment. A real release is owner-run, from a tag, on the
# owner's machine: `dev/release.sh <version>` prepares and tags it, and `mvn -B -Prelease
# deploy` on that tag signs it with the owner's key and uploads it to Maven Central
# (AGENTS.md, "Releases"). What this workflow does is show, on GitHub's runners and before and
# after that, that the release would build. It does not cover the owner's signing: it signs
# with a key made for the run, through Maven's Bouncy Castle signer, where the owner's machine
# signs with gpg and its agent:
#
#   version   The two release scripts' own self-tests; and, on a tag v<version>, that the tag
#             may release the pom's version (dev/release-version.sh): the tag is v<version>, the
#             version is no -SNAPSHOT, the pom's <scm><tag> is the tag, and the tagged commit is
#             on main. With no tag it prints the pom's version and passes.
#   ci        ci.yml's own jobs, called as they are: verify in its four rows with the jar check,
#             the proofs under Z3, the allocation check at the runner's flags and as AVX2, and
#             the bench scripts' tests. A tag does not start ci.yml by itself.
#   proofs    Every proof under Z3 and cvc5, as nightly.yml's job of that name.
#   bundle    What a release would upload, built with the release profile and signed with a key
#             made for the run (never the owner's): the jar, the sources jar, the Javadoc jar and
#             the pom, each with a signature that gpg then verifies, and dev/jar-check.sh
#             --release on the jars. The files are kept seven days as `dry-run-bundle`; they are
#             never a release.
#
# It runs on a push of a tag v*, when dispatched by hand, and on every pull request that touches
# the files below. On a pull request `ci` and `proofs` are skipped: the pull request's own CI
# runs ci.yml on the same commit, so the dry run there is `version` and `bundle`, the two that
# only this workflow has (a pull request does not exercise the call into ci.yml, which a
# dispatch does). A dispatch or a tag runs all four.
#
# Every workflow's actions are pinned by commit, with the version each commit is in a comment.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - pom.xml
      - .github/workflows/release.yml
      - dev/jar-check.sh
      - dev/release-version.sh
      - dev/release.sh
      - CHANGELOG.md
      - .github/workflows/ci.yml
      - LICENSE
      - NOTICE
      - src/main/**
      - dev/prove.sh
      - proofs/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The history, to ask whether a tagged commit is on main.
          fetch-depth: 0
      - name: Check the rules themselves
        run: |
          dev/release-version.sh --self-test
          dev/release.sh --self-test
      - name: Check the tag against the pom
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              dev/release-version.sh "$GITHUB_REF_NAME"
              git fetch --quiet origin main
              if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
                echo "refused: the tagged commit $GITHUB_SHA is not on main"
                exit 1
              fi
              echo "the tagged commit is on main"
              ;;
            *)
              dev/release-version.sh
              ;;
          esac

  ci:
    name: ci
    needs: version
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  proofs:
    name: proofs under both solvers
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Z3 and cvc5
        run: dev/prove.sh --install both
      - name: Check the proofs under both solvers
        run: dev/prove.sh --solver both

  bundle:
    name: bundle
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 25
          cache: maven
      # The command is the owner's `mvn -B -Prelease deploy` with `verify` for `deploy`, so the
      # Javadoc run, the sources jar and the signing are the ones a release makes; the upload is
      # bound to the deploy phase, which verify never reaches. The key is generated here, lives
      # in a directory of its own and signs nothing anyone will see; it reaches Maven in
      # MAVEN_GPG_KEY and MAVEN_GPG_PASSPHRASE, read by maven-gpg-plugin's Bouncy Castle signer,
      # which needs no gpg, no agent and no terminal (the owner's machine signs with gpg and
      # its agent instead). The tests are skipped: `ci` runs them.
      - name: Build, document and sign with a key made for this run
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          passphrase="$(openssl rand -hex 16)"
          gpg --batch --pinentry-mode loopback --passphrase "$passphrase" \
            --quick-generate-key "vfdlibm release dry run" rsa3072 sign 1d
          key="$(gpg --batch --pinentry-mode loopback --passphrase "$passphrase" \
            --armor --export-secret-keys)"
          # Maven gets a gpg home with no key: if the Bouncy Castle signer were not in use,
          # signing would fail here.
          mkdir -m 700 "$RUNNER_TEMP/no-gnupg"
          GNUPGHOME="$RUNNER_TEMP/no-gnupg" \
          MAVEN_GPG_KEY="$key" MAVEN_GPG_PASSPHRASE="$passphrase" \
            mvn -B --no-transfer-progress -Prelease -DskipTests -Dgpg.signer=bc verify
      - name: Check that each file to upload is there and its signature verifies
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          version="$(dev/release-version.sh --version)"
          for file in "vfdlibm-$version.pom" "vfdlibm-$version.jar" \
              "vfdlibm-$version-sources.jar" "vfdlibm-$version-javadoc.jar"; do
            test -s "target/$file"
            gpg --batch --verify "target/$file.asc" "target/$file"
          done
      # --release: the sources jar and the Javadoc jar must be there, with the licence files.
      - name: Check the jar from outside
        run: dev/jar-check.sh --release
      - name: Keep what was built
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Signed with the key made for this run, not the owner's: never a release.
          name: dry-run-bundle
          path: |
            target/*.jar
            target/*.pom
            target/*.asc
          if-no-files-found: error
          retention-days: 7
