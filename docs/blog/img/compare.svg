<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="t5 d5" font-family="Inter, 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">
  <title id="t5">Three ways to compute exp</title>
  <desc id="d5">StrictMath.exp gives StrictMath's bits on every CPU, one double per call. VectorOperators.EXP is vectorized, and promises an accuracy bound, not StrictMath's bits nor the same bits on every CPU; its speed is not measured here. vfdlibm is vectorized and gives StrictMath's bits on every lane; its speedup on exp comes from the v0.3.0 table.</desc>
  <defs>
    <style>
      .ti { font-size: 34px; font-weight: 700; fill: #1d1d1f; }
      .su { font-size: 21px; fill: #6b6b6b; }
      .pill { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; fill: #fff; }
      .rl { font-size: 21px; font-weight: 700; fill: #1d1d1f; }
      .c { font-size: 20px; fill: #333; }
      .b { font-weight: 700; fill: #1d1d1f; }
      .bad { font-weight: 700; fill: #c62828; }
      .m { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace; }
      .cap { font-size: 18px; fill: #6b6b6b; }
    </style>
  </defs>
  <rect x="1" y="1" width="1098" height="758" rx="22" fill="#fbfbfa" stroke="#d6d6d6" stroke-width="2"/>
  <text x="50" y="66" class="ti">Three ways to compute exp</text>
  <text x="50" y="102" class="su">What each one promises, from its Javadoc or this project's committed files.</text>

  <!-- column tabs: label column 50-290, then 300-560, 570-830, 840-1050 -->
  <rect x="300" y="134" width="250" height="40" rx="20" fill="#4a7fd0"/>
  <text x="425" y="160" text-anchor="middle" class="pill">STRICTMATH.EXP</text>
  <rect x="566" y="134" width="250" height="40" rx="20" fill="#8a8a8a"/>
  <text x="691" y="160" text-anchor="middle" class="pill">VECTOROPERATORS.EXP</text>
  <rect x="832" y="134" width="218" height="40" rx="20" fill="#e08a2e"/>
  <text x="941" y="160" text-anchor="middle" class="pill">VFDLIBM.EXP</text>

  <!-- row 1 -->
  <rect x="50" y="194" width="1000" height="104" rx="14" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
  <text x="74" y="236" class="rl">Bits equal</text>
  <text x="74" y="264" class="rl">StrictMath's</text>
  <text x="310" y="236" class="c"><tspan class="b">Yes</tspan>, by</text>
  <text x="310" y="264" class="c">definition: fdlibm 5.3</text>
  <text x="576" y="236" class="c"><tspan class="bad">Not promised</tspan>: the</text>
  <text x="576" y="264" class="c">equivalent method's</text>
  <text x="576" y="288" class="c">accuracy bound</text>
  <text x="842" y="236" class="c"><tspan class="b">Yes</tspan>, every lane,</text>
  <text x="842" y="264" class="c">by raw bits</text>

  <!-- row 2 -->
  <rect x="50" y="310" width="1000" height="92" rx="14" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
  <text x="74" y="352" class="rl">Same bits on</text>
  <text x="74" y="380" class="rl">every CPU</text>
  <text x="310" y="352" class="c"><tspan class="b">Yes</tspan></text>
  <text x="576" y="352" class="c"><tspan class="bad">Not promised</tspan></text>
  <text x="842" y="352" class="c"><tspan class="b">Yes</tspan>, StrictMath's</text>

  <!-- row 3 -->
  <rect x="50" y="414" width="1000" height="92" rx="14" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
  <text x="74" y="456" class="rl">Doubles per call</text>
  <text x="310" y="456" class="c"><tspan class="b">1</tspan></text>
  <text x="576" y="456" class="c">a vector's lanes:</text>
  <text x="576" y="484" class="c"><tspan class="b">4</tspan> at 256 bits, <tspan class="b">8</tspan> at 512</text>
  <text x="842" y="456" class="c">a vector's lanes:</text>
  <text x="842" y="484" class="c"><tspan class="b">4</tspan> or <tspan class="b">8</tspan></text>

  <!-- row 4 -->
  <rect x="50" y="518" width="1000" height="104" rx="14" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
  <text x="74" y="560" class="rl">Speed against</text>
  <text x="74" y="588" class="rl">StrictMath</text>
  <text x="310" y="560" class="c"><tspan class="b">1×</tspan>, the baseline</text>
  <text x="576" y="560" class="c">not measured here</text>
  <text x="842" y="560" class="c"><tspan class="b m">{{E}}×</tspan> on common</text>
  <text x="842" y="588" class="c">data, Xeon 8573C,</text>
  <text x="842" y="612" class="c">v0.3.0 table</text>

  <text x="50" y="684" class="cap">Sources: the JDK 25 Javadoc of Math, StrictMath and VectorOperators; vfdlibm's README and AGENTS.md.</text>
  <text x="50" y="712" class="cap">{{E}}: the exp row's common figure on xeon8573c in the README's v0.3.0 table, a placeholder until then.</text>
</svg>
